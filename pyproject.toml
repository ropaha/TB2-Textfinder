# Development tool configuration; application version lives in tb2/version.py.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Start with syntax and undefined-name errors; expand after dedicated cleanup.
select = ["E9", "F63", "F7", "F82"]
