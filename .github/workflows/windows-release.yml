name: Windows EXE Release-Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: PyInstaller installieren
        run: python -m pip install -r requirements-build.txt

      - name: Textfinder bauen
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --icon logo.ico --add-data "logo.ico;." --add-data "CHANGELOG.md;."
          --name TB2_Textfinder --distpath dist --workpath build
          --specpath . TB2_Textfinder.py

      - name: Negativtester bauen
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --icon logo.ico --add-data "logo.ico;." --add-data "CHANGELOG.md;."
          --hidden-import TB2_Textfinder
          --name TB2_Negativtester --distpath dist --workpath build
          --specpath . TB2_Negativtester.py

      - name: EXE-Dateien prüfen
        shell: pwsh
        run: |
          foreach ($file in @("dist/TB2_Textfinder.exe", "dist/TB2_Negativtester.exe")) {
            if (!(Test-Path $file)) { throw "Build-Datei fehlt: $file" }
          }

      - name: EXE-Dateien an GitHub-Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" "dist/TB2_Textfinder.exe" "dist/TB2_Negativtester.exe" --clobber
