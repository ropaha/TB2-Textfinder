name: Publish official Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.9.1 (without v)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate version and existing releases
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_VERSION
          if ($version -cnotmatch '^\d+\.\d+\.\d+$') {
            throw 'Version must be in X.Y.Z format (without v).'
          }
          $tag = $version
          python version_workflow.py check --release-tag $tag
          if ($LASTEXITCODE -ne 0) { throw 'Program version validation failed.' }
          git fetch --no-tags origin main
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) {
            throw 'The selected commit is no longer the current main HEAD.'
          }
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists." }
          if ($LASTEXITCODE -ne 2) { throw 'Could not verify whether the tag exists.' }
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists." }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build requirements
        run: python -m pip install -r requirements-build.txt

      - name: Build Textfinder
        shell: cmd
        run: call Build_TB2_Textfinder_EXE.bat /nopause

      - name: Build Negativtester
        shell: cmd
        run: call Build_TB2_Negativtester_EXE.bat /nopause

      - name: Verify executables
        shell: pwsh
        run: |
          foreach ($file in @('dist/TB2_Textfinder.exe', 'dist/TB2_Negativtester.exe')) {
            if (-not (Test-Path $file)) { throw "Missing executable: $file" }
          }

      - name: Create tag and publish release with assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_VERSION
          git -c http.extraheader="AUTHORIZATION: basic $([Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")))" push origin "HEAD:refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not create tag $tag" }
          gh release create $tag 'dist/TB2_Textfinder.exe' 'dist/TB2_Negativtester.exe' --verify-tag --latest --title "TB2-Textfinder v$tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag" }
