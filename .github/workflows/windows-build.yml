name: Windows EXE Test-Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version prüfen (Entwicklung oder Release)
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/heads/release/*') {
            $version = $env:GITHUB_REF.Substring('refs/heads/release/'.Length)
            python tools/version_workflow.py check --release-tag $version
          } else {
            python tools/version_workflow.py check --dev
          }
          if ($LASTEXITCODE -ne 0) { throw 'Versionsprüfung fehlgeschlagen.' }

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build/requirements-build.txt

      - name: PyInstaller installieren
        run: python -m pip install -r build/requirements-build.txt

      - name: Alle drei Programme bauen
        run: python build/build.py all

      - name: EXE-Dateien prüfen
        shell: pwsh
        run: |
          foreach ($file in @("dist/TB2_Textfinder.exe", "dist/TB2_Negativtester.exe", "dist/TB2_Textcounter.exe")) {
            if (!(Test-Path $file)) { throw "Build-Datei fehlt: $file" }
            Write-Host "$file ($((Get-Item $file).Length) Bytes)"
          }

      - name: Test-Build herunterladen ermöglichen
        uses: actions/upload-artifact@v4
        with:
          name: TB2-Windows-Test-Build
          path: |
            dist/TB2_Textfinder.exe
            dist/TB2_Negativtester.exe
            dist/TB2_Textcounter.exe
          if-no-files-found: error
          retention-days: 14
