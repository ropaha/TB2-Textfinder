name: Publish official Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.9.1 (without v)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: Validate version and existing releases
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_VERSION
          if ($version -cnotmatch '^\d+\.\d+\.\d+$') {
            throw 'Version must be in X.Y.Z format (without v).'
          }
          $tag = $version
          python tools/version_workflow.py check --release-tag $tag
          if ($LASTEXITCODE -ne 0) { throw 'Program version validation failed.' }
          git fetch --no-tags origin main
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) {
            throw 'The selected commit is no longer the current main HEAD.'
          }
          # Query matching refs via the authenticated GitHub API; distinguish API errors from an empty result.
          $refs = @(gh api "repos/$env:GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing tags via GitHub API.' }
          if ($refs -contains "refs/tags/$tag") { throw "Tag $tag already exists." }

      - name: Install build requirements
        run: python -m pip install -r packaging/requirements-build.txt

      - name: Build all three executables
        run: python packaging/build.py all

      - name: Verify executables
        shell: pwsh
        run: |
          foreach ($file in @('dist/TB2_Textfinder.exe', 'dist/TB2_Negativtester.exe', 'dist/TB2_Textcounter.exe')) {
            if (-not (Test-Path $file)) { throw "Missing executable: $file" }
          }

      - name: Create tag and publish release with assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_VERSION
          # GitHub API uses GH_TOKEN with contents:write; no local Git credentials needed.
          gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Could not create tag $tag" }
          gh release create $tag 'dist/TB2_Textfinder.exe' 'dist/TB2_Negativtester.exe' 'dist/TB2_Textcounter.exe' --verify-tag --latest --title "TB2-Textfinder v$tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag" }
